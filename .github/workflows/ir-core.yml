name: IR core

on:
  pull_request:
    branches: [ir]
  push:
    branches: [ir, 'chat/ir-*']

permissions:
  contents: read

concurrency:
  group: ir-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ir-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Rust and assembler
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y nasm clang lld
      - name: Generated dispatch tables and decoder
        run: |
          mkdir -p build
          make src/rust/gen/interpreter.rs src/rust/gen/interpreter0f.rs
          make ir-generated-check
      - name: Warning-free Rust
        run: |
          RUSTFLAGS="-D warnings" cargo check --release --target wasm32-unknown-unknown
      - name: IR-08 x87 register differential
        run: |
          set -o pipefail
          make ir-x87-tests 2>&1 | tee build/ir08-x87.log
      - name: Control, x87 memory and FP state with pinned semantic reference
        run: |
          set -o pipefail
          make ir-control-reference-tests 2>&1 | tee build/ir-control-reference.log
      - name: SSE FP, MMX and remaining baseline forms
        run: |
          set -o pipefail
          make ir-sse-fp-tests ir-mmx-tests ir-coverage-tests 2>&1 | tee build/ir-coverage-increment.log
      - name: STI shadow, helper continuation and machine allocation
        run: |
          set -o pipefail
          make ir-sti-tests ir-helper-reload-tests ir-mir-owned-tests 2>&1 | tee build/ir-continuation-machine.log
      - name: IR-09 backend completion gate
        run: |
          set -o pipefail
          make ir09-completion-tests 2>&1 | tee build/ir09-completion.log
      - name: Focused IR-11 RAM proof regressions
        run: |
          set -o pipefail
          env RUSTFLAGS="-D warnings" cargo test ir::mir::forwarding -- --nocapture 2>&1 | tee build/ir11-native.log
      - name: Native regressions
        run: |
          set -o pipefail
          env RUSTFLAGS="-D warnings" cargo test 2>&1 | tee build/ir-native.log
      - name: Executable Wasm and decoder oracles
        run: |
          node tests/ir/wasm/run.mjs
          node tests/rust/verify-wasmgen-dummy-output.js
          node tests/ir/decode/oracle.mjs
      - name: Actual CPU LICM and CFG differential regressions
        run: |
          set -o pipefail
          tools/ir-licm-tests.sh 2>&1 | tee build/ir-licm-cpu.log
          node tests/ir/differential/cfg.mjs
      - name: Extended FLAGS backing differentials
        run: |
          set -o pipefail
          make build/v86-ir-test.wasm build/libv86.mjs build/jit-capacity.bin
          node tests/ir/differential/shifts.mjs 2>&1 | tee build/ir-flags-shifts.log
          node tests/ir/differential/bits.mjs 2>&1 | tee build/ir-flags-bits.log
          node tests/ir/differential/multiply.mjs 2>&1 | tee build/ir-flags-multiply.log
      - name: IR-10 per-pass differential
        run: |
          set -o pipefail
          make build/v86-ir-test.wasm build/libv86.mjs build/jit-capacity.bin
          node tests/ir/differential/ir10.mjs 2>&1 | tee build/ir10-per-pass.log
      - name: Guarded RAM forwarding and callback recovery
        run: |
          set -o pipefail
          tools/ir-forwarding-tests.sh 2>&1 | tee build/ir-forwarding-cpu.log
      - name: SIMD state-elision CPU differential
        run: |
          set -o pipefail
          make build/v86-ir-test.wasm build/v86-ir-test-release.wasm build/libv86.mjs build/jit-capacity.bin
          node tests/ir/differential/simd_integer.mjs 2>&1 | tee build/ir-state-elision-simd.log
      - name: Guarded scalar/vector store continuation and recovery
        run: |
          set -o pipefail
          sh tools/ir-store-continuation-tests.sh 2>&1 | tee build/ir-store-continuation-cpu.log
      - name: Exact-budget pure MIR batching
        run: |
          set -o pipefail
          make ir-budget-batch-tests 2>&1 | tee build/ir-budget-batch.log
      - name: IR-12 cache, publication and scheduling lifecycle
        run: |
          set -o pipefail
          make ir-entry-tests ir-live-tests ir-cache-tests ir-auto-tests ir-fusion-tests ir-diagnostic-tests 2>&1 | tee build/ir12-lifecycle.log
      - name: IR-13 host, browser and device acceptance smoke
        run: |
          set -o pipefail
          sh tools/ir13-smoke-tests.sh 2>&1 | tee build/ir13-smoke.log
      - name: Shared decoder, import contracts, system modes and portable IR
        run: |
          set -o pipefail
          make ir-decode-contract-tests ir-system-mode-tests ir-portable-tests 2>&1 | tee build/ir-contract-matrix.log
          node tests/ir/differential/helper_audit.mjs 2>&1 | tee build/ir-helper-audit.log
      - name: Generated sources and whitespace
        run: |
          git diff --exit-code
          git diff --check
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ir-diagnostics-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/ir-*.log
            build/ir-helper-audit.json
            build/ir13-smoke.log
            build/ir13-performance-smoke.json
