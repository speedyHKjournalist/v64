<!doctype html>
<meta charset="utf-8">
<title>v86 graphics with vCPU workers</title>
<!-- W1 (docs/acpi-x86-64-multicore-plan.zh-CN.md): a graphical screen while
     the cores run in vCPU workers, whose wasm memory is shared memory, which
     ImageData refuses (src/vga.js keeps a copy then). tests/parallel/graphics.asm
     draws red above row 240 and green below; the canvas must show both.
     ?build=bundle loads build/libv86.mjs. -->
<pre id="log"></pre>
<div id="result"></div>
<div id="screen_container">
    <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
    <canvas style="display: none"></canvas>
</div>
<script type="module">
const params = new URLSearchParams(location.search);
const log = text => { document.getElementById("log").textContent += text + "\n"; };
const done = text => { document.getElementById("result").textContent = text; };
try
{
    const bundle = params.get("build") === "bundle";
    const { V86 } = await import(bundle ? "../../build/libv86.mjs" : "../../src/main.js");
    const emulator = new V86({
        multiboot: { url: "../../build/parallel-graphics.bin" }, memory_size: 32 << 20, acpi: true, cpu_cores: 2,
        screen_container: document.getElementById("screen_container"), vga_memory_size: 8 << 20,
        autostart: false, log_level: 0, parallel: "auto", wasm_path: "../../build/v86-parallel.wasm",
        ...(bundle ? { vcpu_worker_url: "../../build/vcpu-worker.js" } : {}),
    });
    const failed = new Promise((_, reject) => emulator.add_listener("emulator-error", reject));
    await Promise.race([new Promise(resolve => emulator.add_listener("emulator-loaded", resolve)), failed]);
    const execution = emulator.v86.cpu.get_diagnostics().execution;
    log("execution " + JSON.stringify(execution));
    if(execution.mode !== "parallel") throw new Error("expected parallel, got " + JSON.stringify(execution));
    emulator.run();
    const canvas = document.querySelector("#screen_container canvas");
    const pixel = (x, y) => Array.from(canvas.getContext("2d").getImageData(x, y, 1, 1).data.slice(0, 3));
    const deadline = performance.now() + 30000;
    let top, bottom;
    for(;;)
    {
        await Promise.race([new Promise(resolve => setTimeout(resolve, 200)), failed]);
        if(canvas.width === 640 && canvas.height === 480)
        {
            top = pixel(320, 100);
            bottom = pixel(320, 400);
            if(top.join() === "255,0,0" && bottom.join() === "0,255,0") break;
        }
        if(performance.now() > deadline)
        {
            throw new Error(`canvas ${canvas.width}x${canvas.height}, pixels ${JSON.stringify([top, bottom])}`);
        }
    }
    await emulator.destroy();
    done(`PASS graphics with cores in workers: canvas 640x480, red ${top}, green ${bottom}`);
}
catch(error)
{
    done("FAIL " + (error && error.stack || error));
}
</script>
