<!doctype html>
<meta charset="utf-8">
<title>VMware SVGA II DX: tessellation</title>
<pre id="result">RUNNING</pre>
<script src="../../build/glbridge/libv86-webgpu.js"></script>
<script type="module">
// A quad patch of four control points through the hull shader (control
// point, fork and join phases: tess factors 4, inside 4 and 3), the D3D11
// tessellator and a domain shader that places each point bilinearly between
// the control points and colours it by its (u, v). The square they span is
// filled, its colour the domain location: red grows to the right, green
// downwards.
import * as C from "../../src/graphics_adapters/vmware_svga/svga_constants.js";
import { SVGA3D } from "../../src/graphics_adapters/vmware_svga/svga3d.js";
import { ScreenObjects } from "../../src/graphics_adapters/vmware_svga/svga_screens.js";

const result = document.getElementById("result");
const checks = [];
const check = (value, message) => { if(!value) throw new Error(message); checks.push(message); };
const f32 = v => new Uint32Array(new Float32Array([v]).buffer)[0];

const T = { TEMP: 0, INPUT: 1, OUTPUT: 2, IMMEDIATE32: 4, OUTPUT_CONTROL_POINT_ID: 22, INPUT_CONTROL_POINT: 25, INPUT_PATCH_CONSTANT: 27, INPUT_DOMAIN_POINT: 28 };
const tok = (type, indices, sel, neg) => {
    const words = [(sel | type << 12 | indices.length << 20 | (neg ? 1 << 31 : 0)) >>> 0];
    if(neg) words.push(1 | 1 << 6);
    return [...words, ...indices];
};
const mask = m => 2 | m << 4, swz = (x, y, z, w) => 2 | 1 << 2 | (x | y << 2 | z << 4 | w << 6) << 4, one = c => 2 | 2 << 2 | c << 4;
const XYZW = swz(0, 1, 2, 3);
const ins = (op, ...operands) => { const body = operands.flat(); return [(op | (1 + body.length) << 24) >>> 0, ...body]; };
const insc = (op, controls, ...operands) => { const body = operands.flat(); return [(op | controls << 11 | (1 + body.length) << 24) >>> 0, ...body]; };
const imm = (...values) => [(values.length === 4 ? 2 : 1) | T.IMMEDIATE32 << 12, ...values.map(f32)];
const prog = (type, ...code) => { const body = code.flat(); return new Uint32Array([type << 16 | 5 << 4, 2 + body.length, ...body]); };
const OP = { ADD: 0, MAD: 50, MOV: 54, RET: 62, DCL_INPUT: 95, DCL_OUTPUT: 101, DCL_OUTPUT_SIV: 103, DCL_TEMPS: 104,
    HS_DECLS: 113, HS_CP: 114, HS_FORK: 115, HS_JOIN: 116, DCL_ICP: 147, DCL_OCP: 148, DCL_DOMAIN: 149, DCL_PARTITIONING: 150,
    DCL_PRIMITIVE: 151, DCL_MAX_TF: 152, DCL_FORK_COUNT: 153 };
const icp = (cp, reg, sel, neg) => tok(T.INPUT_CONTROL_POINT, [cp, reg], sel === undefined ? XYZW : sel, neg);
const dom = sel => tok(T.INPUT_DOMAIN_POINT, [], sel);
const r = (i, sel, neg) => tok(T.TEMP, [i], sel, neg);
const o = (i, sel) => tok(T.OUTPUT, [i], sel);

// VS: the control point's position
const VS = prog(1,
    ins(OP.DCL_INPUT, tok(T.INPUT, [0], mask(3))),
    ins(OP.DCL_OUTPUT, o(0, mask(15))),
    ins(OP.MOV, o(0, mask(3)), tok(T.INPUT, [0], XYZW)),
    ins(OP.MOV, o(0, mask(12)), imm(0, 0, 0, 1)),
    ins(OP.RET));
// HS: control points through vicp[vOutputControlPointID]; edges 4, inside 4 x 3
const icpByID = [(2 | 1 << 2 | 0xE4 << 4 | T.INPUT_CONTROL_POINT << 12 | 2 << 20 | 2 << 22) >>> 0, ...tok(T.OUTPUT_CONTROL_POINT_ID, [], one(0)), 0];
const HS = prog(3,
    ins(OP.HS_DECLS),
    insc(OP.DCL_ICP, 4), insc(OP.DCL_OCP, 4), insc(OP.DCL_DOMAIN, 3), insc(OP.DCL_PARTITIONING, 1), insc(OP.DCL_PRIMITIVE, 3),
    ins(OP.DCL_MAX_TF, f32(64)),
    ins(OP.HS_CP),
    ins(OP.DCL_INPUT, icp(4, 0, mask(15))),
    ins(OP.DCL_INPUT, tok(T.OUTPUT_CONTROL_POINT_ID, [], 0)),
    ins(OP.DCL_OUTPUT, o(0, mask(15))),
    ins(OP.MOV, o(0, mask(15)), icpByID),
    ins(OP.RET),
    ins(OP.HS_FORK),
    ins(OP.DCL_FORK_COUNT, 1),
    ...[0, 1, 2, 3].map(i => ins(OP.DCL_OUTPUT_SIV, o(i, mask(1)), 11 + i)),
    ...[0, 1, 2, 3].map(i => ins(OP.MOV, o(i, mask(1)), imm(4))),
    ins(OP.RET),
    ins(OP.HS_JOIN),
    ins(OP.DCL_OUTPUT_SIV, o(4, mask(1)), 15),
    ins(OP.DCL_OUTPUT_SIV, o(5, mask(1)), 16),
    ins(OP.MOV, o(4, mask(1)), imm(4)),
    ins(OP.MOV, o(5, mask(1)), imm(3)),
    ins(OP.RET));
// DS: bilinear between the corners (0 top left, 1 top right, 2 bottom right, 3 bottom left); colour (u, v)
const DS = prog(4,
    insc(OP.DCL_ICP, 4), insc(OP.DCL_DOMAIN, 3),
    ins(OP.DCL_INPUT, dom(mask(3))),
    ins(OP.DCL_INPUT, icp(4, 0, mask(3))),
    ins(OP.DCL_OUTPUT_SIV, o(0, mask(15)), 1),
    ins(OP.DCL_OUTPUT, o(1, mask(15))),
    ins(OP.DCL_TEMPS, 2),
    ins(OP.ADD, r(0, mask(3)), icp(0, 0, XYZW, true), icp(1, 0)),
    ins(OP.MAD, r(0, mask(3)), dom(swz(0, 0, 0, 0)), r(0, XYZW), icp(0, 0)),
    ins(OP.ADD, r(1, mask(3)), icp(3, 0, XYZW, true), icp(2, 0)),
    ins(OP.MAD, r(1, mask(3)), dom(swz(0, 0, 0, 0)), r(1, XYZW), icp(3, 0)),
    ins(OP.ADD, r(1, mask(3)), r(0, XYZW, true), r(1, XYZW)),
    ins(OP.MAD, o(0, mask(3)), dom(swz(1, 1, 1, 1)), r(1, XYZW), r(0, XYZW)),
    ins(OP.MOV, o(0, mask(12)), imm(0, 0, 0, 1)),
    ins(OP.MOV, o(1, mask(3)), dom(XYZW)),
    ins(OP.MOV, o(1, mask(12)), imm(0, 0, 0, 1)),
    ins(OP.RET));
const PS = new Uint32Array([0 << 16 | 4 << 4, 0, ...[
    ins(98 /* DCL_INPUT_PS */, tok(T.INPUT, [1], mask(15))).map((w, i) => i === 0 ? (w | 2 << 11) >>> 0 : w),
    ins(OP.DCL_OUTPUT, o(0, mask(15))),
    ins(OP.MOV, o(0, mask(15)), tok(T.INPUT, [1], XYZW)),
    ins(OP.RET)].flat()]);
PS[1] = PS.length;

(async () => {
    try {
        const mobs = new Map();
        const mob_table = {
            read: (id, offset, length) => { const m = mobs.get(id); return m && offset + length <= m.length ? m.slice(offset, offset + length) : null; },
            write: (id, offset, bytes) => { const m = mobs.get(id); if(!m || offset + bytes.length > m.length) return false; m.set(bytes, offset); return true; },
            size: id => mobs.has(id) ? mobs.get(id).length : -1,
        };
        const screens = new ScreenObjects({ read: () => null, write: () => false });
        const device = { caps: C.SVGA_CAP_3D | C.SVGA_CAP_GBOBJECTS | C.SVGA_CAP_DX, level: "dx11",
            gmrs: { read: () => null, write: () => false }, mobs: mob_table, otables: null, screens,
            set_irq: () => {}, svga_active: () => false };
        const handlers = [null, null];
        const end = (self, other) => ({ post: message => handlers[other] && handlers[other](message), listen: handler => { handlers[self] = handler; } });
        const renderer = globalThis.V86SVGARenderer(end(1, 0), {});
        globalThis.svgaWarnings = [];
        for(const method of ["warn", "error"])
        {
            const original = console[method];
            console[method] = (...args) => { globalThis.svgaWarnings.push(args.map(a => typeof a === "object" ? JSON.stringify(a) : String(a)).join(" ")); original.apply(console, args); };
        }
        const svga3d = new SVGA3D(device, end(0, 1));
        const run = (id, ...body) => svga3d.command(id, Int32Array.from(body, v => v | 0));
        const finished = () => new Promise(resolve => svga3d.after_work(resolve));

        const RT = 10, VB = 11, U8 = C.SVGA3D_R8G8B8A8_UNORM, SIZE = 64;
        mobs.set(1, new Uint8Array(SIZE * SIZE * 4));
        mobs.set(2, new Uint8Array(new Float32Array([-0.75, 0.75, 0.75, 0.75, 0.75, -0.75, -0.75, -0.75]).buffer));
        const shaders = new Uint8Array(8192);
        [VS, HS, DS, PS].forEach((s, i) => shaders.set(new Uint8Array(s.buffer), i * 2048));
        mobs.set(3, shaders);
        run(C.SVGA_3D_CMD_DEFINE_GB_SURFACE_V2, RT, C.SVGA3D_SURFACE_BIND_RENDER_TARGET, U8, 1, 0, 0, SIZE, SIZE, 1, 1, 0);
        run(C.SVGA_3D_CMD_DEFINE_GB_SURFACE_V2, VB, C.SVGA3D_SURFACE_BIND_VERTEX_BUFFER, C.SVGA3D_BUFFER, 1, 0, 0, 32, 1, 1, 1, 0);
        run(C.SVGA_3D_CMD_BIND_GB_SURFACE, RT, 1);
        run(C.SVGA_3D_CMD_BIND_GB_SURFACE, VB, 2);
        const CID = 1;
        run(C.SVGA_3D_CMD_DX_DEFINE_CONTEXT, CID);
        svga3d.dx_context = CID;
        run(C.SVGA_3D_CMD_DX_DEFINE_RENDERTARGET_VIEW, 0, RT, U8, C.SVGA3D_RESOURCE_TEXTURE2D, 0, 0, 1);
        run(C.SVGA_3D_CMD_DX_DEFINE_ELEMENTLAYOUT, 0, 0, 0, C.SVGA3D_R32G32_FLOAT, 0, 0, 0);
        // solid, no culling, depth clip
        run(C.SVGA_3D_CMD_DX_DEFINE_RASTERIZER_STATE, 0, 3 | 1 << 8, 0, 0, 0, 1, f32(1), 0);
        const types = [C.SVGA3D_SHADERTYPE_VS, C.SVGA3D_SHADERTYPE_HS, C.SVGA3D_SHADERTYPE_DS, C.SVGA3D_SHADERTYPE_PS];
        [VS, HS, DS, PS].forEach((s, i) => {
            run(C.SVGA_3D_CMD_DX_DEFINE_SHADER, i + 1, types[i], s.byteLength);
            run(C.SVGA_3D_CMD_DX_BIND_SHADER, CID, i + 1, 3, i * 2048);
            run(C.SVGA_3D_CMD_DX_SET_SHADER, i + 1, types[i]);
        });
        run(C.SVGA_3D_CMD_DX_SET_INPUT_LAYOUT, 0);
        run(C.SVGA_3D_CMD_DX_SET_RASTERIZER_STATE, 0);
        run(C.SVGA_3D_CMD_DX_SET_VERTEX_BUFFERS, 0, VB, 8, 0);
        run(C.SVGA_3D_CMD_DX_SET_TOPOLOGY, C.SVGA3D_PRIMITIVE_4_CONTROL_POINT_PATCH);
        run(C.SVGA_3D_CMD_DX_SET_RENDERTARGETS, 0xFFFFFFFF, 0);
        run(C.SVGA_3D_CMD_DX_SET_VIEWPORTS, 0, f32(0), f32(0), f32(SIZE), f32(SIZE), f32(0), f32(1));
        run(C.SVGA_3D_CMD_DX_CLEAR_RENDERTARGET_VIEW, 0, f32(0), f32(0), f32(0), f32(1));
        run(C.SVGA_3D_CMD_DX_DRAW, 4, 0);
        run(C.SVGA_3D_CMD_DX_READBACK_SUBRESOURCE, RT, 0);
        await finished();
        const gx = renderer.gx;
        check(gx && gx.stats.tessellatedDraws === 1, "one tessellated draw (" + JSON.stringify(gx && gx.stats) + ")");
        const out = mobs.get(1);
        const pixel = (x, y) => Array.from(out.subarray((y * SIZE + x) * 4, (y * SIZE + x) * 4 + 4));
        const centre = pixel(32, 32), left = pixel(12, 32), right = pixel(51, 32), top = pixel(32, 12), bottom = pixel(32, 51);
        check(Math.abs(centre[0] - 128) < 8 && Math.abs(centre[1] - 128) < 8, "the centre is (u, v) = (0.5, 0.5): " + centre);
        check(left[0] < 40 && right[0] > 215, "u grows to the right: " + left + " / " + right);
        check(top[1] < 40 && bottom[1] > 215, "v grows downwards: " + top + " / " + bottom);
        check(pixel(2, 2).join() === "0,0,0,255" && pixel(61, 61).join() === "0,0,0,255", "outside the square: the clear colour");
        // every pixel inside is covered: no cracks between the tessellated triangles
        let holes = 0;
        for(let y = 10; y < 54; y++) for(let x = 10; x < 54; x++) if(pixel(x, y)[3] === 255 && pixel(x, y)[0] + pixel(x, y)[1] === 0 && (x > 10 || y > 10)) holes++;
        check(holes === 0, "no holes inside (" + holes + ")");

        const warnings = globalThis.svgaWarnings.filter(w => /\[gx\]|WGSL|WebGPU/.test(w));
        check(!warnings.length, "no GX warnings: " + warnings.join(" / "));
        result.textContent = "PASS\n" + checks.join("\n");
    } catch(error) {
        result.textContent = "FAIL " + (error.stack || error) + "\n" + checks.join("\n") + "\nwarnings: " + (globalThis.svgaWarnings || []).join("\n");
    }
})();
</script>
