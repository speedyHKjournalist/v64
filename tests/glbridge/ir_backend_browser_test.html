<!doctype html>
<meta charset="utf-8">
<title>IR backend and CPU Worker integration</title>
<pre id="result">Running IR backend checks…</pre>
<script type="module">
import { V86 } from "../../build/libv86.mjs";
import { backend_scenarios } from "../ir/backend-scenarios.mjs";
const lines = [];
try {
    for(const cpu_worker of [false, true]) {
        await backend_scenarios(V86, {
            wasm_path: "../../build/v86-ir-runtime.wasm",
            bios: { url: "../../build/cpu-worker-test.bin" },
            cpu_worker, cpu_worker_url: "../../build/cpu-worker.js",
        }, line => lines.push(`${cpu_worker ? "Worker" : "Main thread"}: ${line}`));
    }
    document.querySelector("#result").textContent = "PASS\n" + lines.join("\n");
} catch(error) {
    document.querySelector("#result").textContent = "FAIL\n" + lines.join("\n") + "\n" + error.stack;
}
</script>
