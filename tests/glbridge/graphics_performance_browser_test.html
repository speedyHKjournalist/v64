<!doctype html><meta charset="utf-8"><title>Graphics diagnostics integration</title>
<pre id="result">RUNNING</pre>
<script src="../../build/glbridge/libv86-webgpu.js"></script>
<script type="module">
import { GraphicsPerformance } from "../../src/browser/graphics_performance.js";
(async () => {
    const checks = [];
    const check = (ok, label) => { if(!ok) throw new Error(label); checks.push(label); };
    const adapter = await navigator.gpu.requestAdapter();
    check(!!adapter, "real WebGPU adapter available");
    const device = await adapter.requestDevice();
    const errors = [];
    device.addEventListener("uncapturederror", event => errors.push(String(event.error)));
    const texture = device.createTexture({ size: [64, 64], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT });
    const journal = new V86GraphicsJournal({ pageBytes: 65536, budget: 8 * 65536, store: null });
    const executor = { device, stats: { commands: 0, presents: 0 }, options: {},
        submit(bytes, metadata) { return this.executeBatch(bytes, metadata); },
        executeBatch() { this.stats.commands++; this.finishFrame(true); },
        finishFrame(present) {
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginRenderPass({ colorAttachments: [{ view: texture.createView(), loadOp: "clear",
                storeOp: "store", clearValue: { r: .25, g: .5, b: .75, a: 1 } }] });
            pass.end(); device.queue.submit([encoder.finish()]);
            if(present) { this.stats.presents++; this.options.onPresent?.({ sessionKey: "game" }); }
        } };
    const emulator = { graphics_proxy: { bridge: { d3d8Executor: executor, graphicsJournal: journal, pushPCIBatch() {} } } };
    const originalSubmit = device.queue.submit, originalAppend = journal.append;
    const recording = new GraphicsPerformance(emulator);
    const payload = new Uint8Array(4096).fill(7);
    for(let i = 0; i < 80; i++) {
        await new Promise(requestAnimationFrame);
        journal.append({ commandCount: 1 }, payload);
        executor.submit(new Uint8Array(0), {});
    }
    await journal.snapshot();
    await device.queue.onSubmittedWorkDone();
    await new Promise(resolve => setTimeout(resolve, 20));
    const report = recording.stop();
    check(report.hook_failures === 0, "real GPUQueue instance supports reversible submit observation");
    check(report.gpu_queues.length === 1 && report.gpu_queues[0].submit.calls === 80, "records every real GPU submission once");
    check(report.gpu_queues[0].fence.completed > 0 && report.gpu_queues[0].fence.calls <= 8,
        "GPU completion probes are asynchronous and rate limited");
    check(report.streams.find(row => row.api === "d3d8").events === 80 &&
        report.streams.some(row => row.api === "browser-raf"), "separates game Present from browser callbacks");
    check(report.journal.worker_pages > 0 && report.journal.worker_wall_ms >= 0,
        "actual transferred-page compression worker returns timing");
    check(report.journal.compressed_bytes < report.journal.raw_bytes && report.journal.pending === 0,
        "compression observation preserves data flow and completion");
    check(device.queue.submit === originalSubmit && journal.append === originalAppend &&
        !Object.hasOwn(journal, "performanceTiming"), "stop removes GPU and journal hooks");
    let count = 0;
    for await(const record of V86GraphicsJournal.records(V86GraphicsJournal.parse(await journal.snapshot()))) {
        check(record.bytes.length === 4096 && record.bytes[0] === 7, "journal record remains restorable"); count++;
    }
    check(count === 80 && errors.length === 0, "all journal entries restored without GPU validation errors");

    // Alternate the same real queue/page workload with diagnostics disabled and
    // enabled. Measure synchronous submission/copy work, not rAF wait time.
    const overhead = [];
    for(const enabled of [false, true, true, false, false, true]) {
        const probe = enabled ? new GraphicsPerformance(emulator) : null;
        let syncMs = 0;
        for(let i = 0; i < 200; i++) {
            if(i % 10 === 0) await new Promise(requestAnimationFrame);
            const start = performance.now();
            journal.append({}, payload);
            executor.submit(new Uint8Array(0), {});
            syncMs += performance.now() - start;
        }
        await journal.work; await device.queue.onSubmittedWorkDone();
        if(probe) probe.stop();
        overhead.push({ enabled, synchronous_ms: syncMs });
    }
    await journal.destroy(); texture.destroy(); device.destroy();
    return { status: "PASS", checks: [...new Set(checks)], overhead,
        recording: { gpu_queues: report.gpu_queues, journal: report.journal, streams: report.streams } };
})().catch(error => ({ status: "FAIL", error: error.stack })).then(result => {
    document.getElementById("result").textContent = JSON.stringify(result);
    fetch("/__test_result", { method: "POST", body: JSON.stringify(result) });
});
</script>
