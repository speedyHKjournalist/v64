<!doctype html>
<meta charset="utf-8">
<title>GL CPU validation and forwarding</title>
<canvas id="gpu" width="64" height="64"></canvas>
<pre id="result">RUNNING</pre>
<script src="../../src/browser/glbridge/webgpu_host.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_protocol.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_constants.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_caps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_math.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_pixel_maps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_glslang.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_glsl.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_objects.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_state.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_raster.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_fixed.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_misc.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_rasterpos.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shadow_pixelmaps.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_state_layout.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_shader_translator.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_fixed_function.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_arb_program.js"></script>
<script src="../../src/browser/glbridge/gl-webgpu/gl_executor.js"></script>
<script src="gl_stream_builder.js"></script>
<script>
(async () => {
    "use strict";
    const { GLStream, GL } = GLTestStream, P = GLProtocol;
    const check = (value, message) => { if (!value) throw new Error(message); };
    try {
        const compiler = await WebAssembly.compile(await (await fetch("../../bios/glslang.wasm")).arrayBuffer());
        for (const remote of [false, true]) {
            const shadow = new V86GLShadow.GLShadow();
            shadow.setGlslang(new V86GLGlslang.Glslang(compiler));
            const s = new GLStream().makeCurrent(1, 0, 0, 64, 64, 1, 1)
                .call("CLEAR_COLOR", 0, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT)
                .call("LINE_WIDTH", 3).call("LINE_WIDTH", 0)
                .call("VIEWPORT", 0, 0, 0, -1).call("DEPTH_FUNC", 0)
                .call("MATRIX_MODE", 0).call("LOAD_IDENTITY")
                .call("COLOR4F", 0.25, 0.75, 0.5, 1).call("BEGIN", GL.QUADS)
                .call("VERTEX3F", -1, -1, 0).call("VERTEX3F", 1, -1, 0)
                .call("VERTEX3F", 1, 1, 0).call("VERTEX3F", -1, 1, 0).call("END");
            s.queryError(); const error = s.payloadView();
            const pixels = s.readPixels(31, 31, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4);
            const bytes = s.bytes();
            const executor = new GLWebGPUExecutorModule.GLWebGPUExecutor(document.getElementById("gpu"), {
                strict: true, writeGuestMemory: (offset, data) => bytes.set(data, offset),
            });
            await executor.initialize(); shadow.setCapabilities(executor.capabilities());
            shadow.process(bytes); check(shadow.stats.rejected === 4, "CPU must reject all four invalid calls");
            executor.submit(remote ? bytes.slice() : bytes, {}); await executor.idle();
            await executor.device.queue.onSubmittedWorkDone();
            for (let i = 0; i < 4; ++i) await new Promise(resolve => setTimeout(resolve, 0));
            check(pixels.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "readback must finish");
            const rgba = pixels.bytes.subarray(32);
            check([64, 191, 128, 255].every((v, i) => Math.abs(rgba[i] - v) <= 1), "rejected state changed the pixels: " + Array.from(rgba));
            if (!remote) check(error.view.getUint32(P.F.QUERY_ERROR.value, true) === GL.INVALID_VALUE, "first GL error must survive forwarding");
            check(!executor.gpuErrors.errors.length, "WebGPU must accept the whole frame");
            check(!executor.hostErrors.length && !executor.stats.refusals, "no host exception or unknown rejected opcode");
            for (const [ref, clamped] of [[-7, 0], [1000, 255]]) {
                const stencil = new GLStream().makeCurrent(1, 0, 0, 64, 64, 1, 1)
                    .call("CLEAR_COLOR", 0, 0, 0, 1).call("CLEAR_STENCIL", clamped)
                    .call("CLEAR", GL.COLOR_BUFFER_BIT | GL.STENCIL_BUFFER_BIT)
                    .call("ENABLE", GL.STENCIL_TEST).call("STENCIL_FUNC", GL.EQUAL, ref, 0xFFFFFFFF)
                    .call("COLOR4F", 0.25, 0.75, 0.5, 1).call("BEGIN", GL.QUADS)
                    .call("VERTEX3F", -1, -1, 0).call("VERTEX3F", 1, -1, 0)
                    .call("VERTEX3F", 1, 1, 0).call("VERTEX3F", -1, 1, 0).call("END");
                const out = stencil.readPixels(31, 31, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4);
                const guest = stencil.bytes(); shadow.process(guest);
                executor.options.writeGuestMemory = (offset, data) => guest.set(data, offset);
                executor.submit(remote ? guest.slice() : guest, {}); await executor.idle();
                check(out.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "stencil readback must finish");
                check([64, 191, 128, 255].every((v, i) => Math.abs(out.bytes[32 + i] - v) <= 1),
                    "stencil reference wrapped instead of clamping: " + ref);
            }
            const setup = new GLStream().makeCurrent(10, 0, 0, 64, 64, 10, 10)
                .call("CREATE_SHADER", 1, GL.VERTEX_SHADER).shaderSource(1, "void main() { gl_Position = gl_Vertex; }").call("COMPILE_SHADER", 1)
                .call("CREATE_SHADER", 2, GL.FRAGMENT_SHADER).shaderSource(2,
                    "#version 120\nuniform bvec3 flags; uniform sampler2D images[2]; void main() { gl_FragColor = vec4(vec3(flags), 1.0) * texture2D(images[0], vec2(0.5)) * texture2D(images[1], vec2(0.5)); }")
                .call("COMPILE_SHADER", 2).call("CREATE_PROGRAM", 5).call("ATTACH_SHADER", 5, 1).call("ATTACH_SHADER", 5, 2)
                .call("LINK_PROGRAM", 5).call("USE_PROGRAM", 5);
            const flags = setup.queryLocation(P.C.V86GL_LOCATION_KIND_UNIFORM, 5, "flags", 32);
            const images = setup.queryLocation(P.C.V86GL_LOCATION_KIND_UNIFORM, 5, "images[1]", 32);
            const first = setup.bytes(); shadow.process(first); executor.submit(remote ? first.slice() : first, {});
            const flagsAt = flags.view.getInt32(P.F.QUERY_LOCATION.result, true), imagesAt = images.view.getInt32(P.F.QUERY_LOCATION.result, true) - 1;
            check(flagsAt >= 0 && imagesAt >= 0, "CPU must link and reflect the GLSL program");
            const draw = new GLStream().uniformfv(flagsAt, 3, 1, [-0, 2, -3]).uniformiv(imagesAt, 1, 3, [2, 0, 1])
                .uniformiv(imagesAt + 1, 1, 1, [7])
                .uniformfv(imagesAt, 1, 1, [0]).call("DELETE_SHADER", 2).call("DELETE_PROGRAM", 5);
            for (const [unit, name, color] of [[2, 1, [255, 255, 255, 255]], [7, 2, [64, 128, 192, 255]]]) {
                draw.call("ACTIVE_TEXTURE", GL.TEXTURE0 + unit).call("BIND_TEXTURE", GL.TEXTURE_2D, name)
                    .call("TEX_PARAMETERI", GL.TEXTURE_2D, GL.TEXTURE_MIN_FILTER, GL.NEAREST)
                    .texImage2D(GL.TEXTURE_2D, 0, GL.RGBA, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, new Uint8Array(color));
            }
            draw.call("CLEAR_COLOR", 1, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT).call("BEGIN", GL.QUADS)
                .call("VERTEX3F", -1, -1, 0).call("VERTEX3F", 1, -1, 0).call("VERTEX3F", 1, 1, 0).call("VERTEX3F", -1, 1, 0).call("END");
            const out = draw.readPixels(31, 31, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4), guest = draw.bytes();
            shadow.process(guest); executor.options.writeGuestMemory = (offset, data) => guest.set(data, offset);
            executor.submit(remote ? guest.slice() : guest, {}); await executor.idle();
            check(out.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "GLSL readback must finish");
            check([0, 128, 192, 255].every((v, i) => Math.abs(out.bytes[32 + i] - v) <= 1),
                "uniform arrays, booleans or deferred deletion changed GLSL pixels: " + Array.from(out.bytes.subarray(32)));
            check(!executor.gpuErrors.errors.length && !executor.hostErrors.length && !executor.stats.refusals, "GLSL frame must have no host errors");
            const assembly = new GLStream().makeCurrent(20, 0, 0, 64, 64, 20, 20)
                .programParameterARB(P.C.V86GL_PROGRAM_PARAMETER_ENV, GL.VERTEX_PROGRAM_ARB, 95, [0.25, 0.5, 0.75, 1])
                .programParameterARB(P.C.V86GL_PROGRAM_PARAMETER_LOCAL, GL.VERTEX_PROGRAM_ARB, 95, [1, 1, 1, 1])
                .programParameterARB(P.C.V86GL_PROGRAM_PARAMETER_LOCAL, GL.FRAGMENT_PROGRAM_ARB, 27, [1, 1, 1, 1])
                .programStringARB(GL.VERTEX_PROGRAM_ARB, "!!ARBvp1.0\nMOV result.position,vertex.position;\nMUL result.color,program.env[95],program.local[95];\nEND")
                .programStringARB(GL.FRAGMENT_PROGRAM_ARB, "!!ARBfp1.0\nMUL result.color,fragment.color,program.local[27];\nEND")
                .call("ENABLE", GL.VERTEX_PROGRAM_ARB).call("ENABLE", GL.FRAGMENT_PROGRAM_ARB)
                .call("CLEAR_COLOR", 0, 0, 0, 1).call("CLEAR", GL.COLOR_BUFFER_BIT)
                .call("BEGIN", GL.QUADS).call("VERTEX3F", -1, -1, 0).call("VERTEX3F", 1, -1, 0)
                .call("VERTEX3F", 1, 1, 0).call("VERTEX3F", -1, 1, 0).call("END");
            const arbOut = assembly.readPixels(31, 31, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4), arbBytes = assembly.bytes();
            shadow.process(arbBytes); executor.options.writeGuestMemory = (offset, data) => arbBytes.set(data, offset);
            executor.submit(remote ? arbBytes.slice() : arbBytes, {}); await executor.idle();
            check(arbOut.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "ARB readback must finish");
            check([64, 128, 191, 255].every((v, i) => Math.abs(arbOut.bytes[32 + i] - v) <= 1),
                "ARB default programs or high vertex/local parameter layout changed pixels: " + Array.from(arbOut.bytes.subarray(32)));
            check(!executor.gpuErrors.errors.length && !executor.hostErrors.length && !executor.stats.refusals, "ARB frame must have no host errors");
            for (const [z, expected] of [[0.25, [0, 0, 0, 255]], [0.05, [255, 0, 0, 255]]]) {
                const raster = new GLStream().makeCurrent(30, 0, 0, 64, 64, 30, 30).call("CLEAR_COLOR", 0, 0, 0, 1)
                    .call("CLEAR_DEPTH", 0.3).call("CLEAR", GL.COLOR_BUFFER_BIT | GL.DEPTH_BUFFER_BIT)
                    .call("ENABLE", GL.DEPTH_TEST).call("DEPTH_FUNC", GL.LESS).call("DEPTH_RANGE", 0.25, 0.75)
                    .call("COLOR4F", 1, 0, 0, 1).call("WINDOW_POS3F", 31, 31, z)
                    .bitmap(1, 1, 0, 0, 0, 0, new Uint8Array([0x80, 0, 0, 0]));
                const pixel = raster.readPixels(31, 31, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4), memory = raster.bytes();
                shadow.process(memory); executor.options.writeGuestMemory = (offset, data) => memory.set(data, offset);
                executor.submit(remote ? memory.slice() : memory, {}); await executor.idle();
                check(pixel.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "raster readback must finish");
                check(expected.every((v, i) => Math.abs(pixel.bytes[32 + i] - v) <= 1), "WindowPos depth range changed the bitmap: " + z);
            }
            const mapped = new GLStream().makeCurrent(40, 0, 0, 64, 64, 40, 40)
                .pixelMap("PIXEL_MAPUIV", GL.PIXEL_MAP_R_TO_R, [0, 0xFFFFFFFF, 0, 0xFFFFFFFF])
                .pixelMap("PIXEL_MAPUSV", GL.PIXEL_MAP_G_TO_G, [65535, 0, 65535, 0])
                .pixelMap("PIXEL_MAPFV", GL.PIXEL_MAP_B_TO_B, [0.25, 0.5, 0.75, 1]).pixelMap("PIXEL_MAPFV", GL.PIXEL_MAP_A_TO_A, [1])
                .call("PIXEL_TRANSFERI", GL.MAP_COLOR, 1).call("WINDOW_POS3F", 31, 31, 0.5)
                .drawPixels(1, 1, GL.RGBA, GL.UNSIGNED_BYTE, new Uint8Array([255, 0, 170, 255]))
                .call("PIXEL_TRANSFERI", GL.MAP_COLOR, 0);
            const mapPixel = mapped.readPixels(31, 31, 1, 1, GL.RGBA, GL.UNSIGNED_BYTE, 4), mapMemory = mapped.bytes();
            shadow.process(mapMemory); executor.options.writeGuestMemory = (offset, data) => mapMemory.set(data, offset);
            executor.submit(remote ? mapMemory.slice() : mapMemory, {}); await executor.idle();
            check(mapPixel.view.getUint32(P.F.READ_PIXELS.status, true) === 1, "pixel-map readback must finish");
            check([255, 255, 191, 255].every((v, i) => Math.abs(mapPixel.bytes[32 + i] - v) <= 1), "integer/short pixel maps changed pixels");
        }
        document.getElementById("result").textContent = "PASS -- CPU validation, GLSL lifetime/uniforms, ARB parameters and typed pixel maps preserve pixels in local and copied streams";
    } catch (error) {
        document.getElementById("result").textContent = "FAIL " + (error.stack || error);
    }
})();
</script>
